name: 构建 iPhone IPA
on:
  push:
    branches: [ci/v0.4.2-iphone-arm]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      simulator:
        description: 额外启动 iPhone 模拟器验收
        type: boolean
        default: false
      signing:
        description: unsigned 用于编译或后续签名，ad-hoc 用于已登记的 iPhone
        type: choice
        default: unsigned
        required: true
        options:
          - unsigned
          - ad-hoc

permissions:
  contents: read

jobs:
  iphone:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build ipa]')
    runs-on: macos-26
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ece384eb79bfd938e1fafa0ca33b2a2cb5289465
          persist-credentials: false
      - name: 检查工具版本并运行计算核心测试
        run: |
          xcodebuild -version
          swift test
      - name: 构建未签名 IPA
        if: github.event_name == 'push' || inputs.signing == 'unsigned'
        run: python3 .github/scripts/build_ipa.py unsigned
      - name: 在模拟 iPhone 外部修改工作区并重载验证
        if: github.event_name == 'workflow_dispatch' && inputs.simulator
        run: python3 .github/scripts/test_workspace_simulator.py
      - name: 在模拟 iPhone 核验长历史、日期滚轮和五套回测
        if: github.event_name == 'workflow_dispatch' && inputs.simulator
        run: python3 tools/test_history_simulator.py --out "$RUNNER_TEMP/history-iphone"
      - name: 保存 iPhone 模拟器测试结果
        if: always() && github.event_name == 'workflow_dispatch' && inputs.simulator
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iPhone-history-test
          path: ${{ runner.temp }}/history-iphone/History.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: 给已登记的 iPhone 构建签名 IPA
        if: github.event_name == 'workflow_dispatch' && inputs.signing == 'ad-hoc'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: python3 .github/scripts/build_ipa.py ad-hoc
      - name: 保存可下载的 IPA
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/stockresearch-ipa/*.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: iphone
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: 校验并发布安装包
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.iphone.outputs.artifact_id }}
          DIGEST: ${{ needs.iphone.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/StockResearch-unsigned.ipa"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ipa"
          test "$(sha256sum "$ipa" | cut -d' ' -f1)" = "${DIGEST#sha256:}"
          unzip -tq "$ipa"
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "$ipa" --verify-tag "${flags[@]}" --title "股票研究台 iPhone $GITHUB_REF_NAME" --notes-file "releases/$GITHUB_REF_NAME.md"
